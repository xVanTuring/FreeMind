<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B7CFA"/>
      <stop offset="0.55" stop-color="#3347C4"/>
      <stop offset="1" stop-color="#1A2268"/>
    </linearGradient>
    <linearGradient id="shine" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="center" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4E9FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12"/>
      <feOffset dx="0" dy="10"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="224" ry="224" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="224" ry="224" fill="url(#shine)"/>

  <g filter="url(#shadow)">
    <!-- 分支连线 -->
    <g fill="none" stroke-width="26" stroke-linecap="round">
      <path d="M640 512 C 712 512, 700 318, 772 318" stroke="#FFC94D"/>
      <path d="M640 512 C 712 512, 700 706, 772 706" stroke="#5EE6B0"/>
      <path d="M384 512 C 312 512, 324 318, 252 318" stroke="#FF7A8A"/>
      <path d="M384 512 C 312 512, 324 706, 252 706" stroke="#7CD4FF"/>
    </g>
    <!-- 分支主题 -->
    <rect x="752" y="282" width="150" height="72" rx="36" fill="#FFC94D"/>
    <rect x="752" y="670" width="150" height="72" rx="36" fill="#5EE6B0"/>
    <rect x="122" y="282" width="150" height="72" rx="36" fill="#FF7A8A"/>
    <rect x="122" y="670" width="150" height="72" rx="36" fill="#7CD4FF"/>
    <!-- 中心主题 -->
    <rect x="352" y="432" width="320" height="160" rx="52" fill="url(#center)"/>
    <rect x="410" y="490" width="204" height="18" rx="9" fill="#3347C4"/>
    <rect x="440" y="524" width="144" height="16" rx="8" fill="#3347C4" opacity="0.45"/>
  </g>
</svg>
